<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>CortexOS — Neural Command Center</title>
    <meta name="description" content="CortexOS — Local-first desktop command center for projects, university study, gaming turbo, audio, and deadlines." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="CortexOS — Neural Command Center" />
    <meta property="og:description" content="Local-first desktop command center for projects, study, hardware controls, audio, and deadlines." />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta property="og:image" content="/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var raw = localStorage.getItem('cortex-theme');
          var theme = 'dark';
          if (raw) {
            try { theme = JSON.parse(raw); } catch(e) { theme = raw; }
          }
          document.documentElement.setAttribute('data-theme', theme);
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          var rawMotion = localStorage.getItem('cortex-motion');
          var motion = 'cinematic';
          if (rawMotion) {
            try { motion = JSON.parse(rawMotion); } catch(e) { motion = rawMotion; }
          }
          document.documentElement.setAttribute('data-motion', motion);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-background text-foreground antialiased selection:bg-cyan-500/30 selection:text-cyan-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
