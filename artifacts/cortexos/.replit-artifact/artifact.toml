kind = "web"
previewPath = "/"
title = "CortexOS Control Center"
description = "A personal command center for developers, university students, and gamers with project management, study intelligence, gaming utilities, deadlines, music, AI routing, and Supabase-ready sync surfaces."
version = "1.0.0"
id = "artifacts/cortexos"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18368

[services.development]
run = "pnpm --filter @workspace/cortexos run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cortexos", "run", "build" ]
serve = "static"
publicDir = "artifacts/cortexos/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18368"
BASE_PATH = "/"
