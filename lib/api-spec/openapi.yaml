openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: cortex
    description: CortexOS command center operations
  - name: projects
    description: Project vault operations
  - name: notes
    description: Quick notes operations
  - name: deadlines
    description: Deadline radar operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /cortex/overview:
    get:
      operationId: getCortexOverview
      tags: [cortex]
      summary: Get the CortexOS command center overview
      responses:
        "200":
          description: Overview data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CortexOverview"
  /cortex/integrations:
    get:
      operationId: getIntegrationStatus
      tags: [cortex]
      summary: Get configured and planned API integrations
      responses:
        "200":
          description: Integration status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IntegrationStatus"
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List projects in the project vault
      responses:
        "200":
          description: Project list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Add a project to the project vault
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /notes:
    get:
      operationId: listNotes
      tags: [notes]
      summary: List quick notes
      responses:
        "200":
          description: Note list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Note"
    post:
      operationId: createNote
      tags: [notes]
      summary: Create a quick note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteInput"
      responses:
        "201":
          description: Created note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
  /notes/{id}:
    patch:
      operationId: updateNote
      tags: [notes]
      summary: Update a quick note
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteUpdate"
      responses:
        "200":
          description: Updated note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
    delete:
      operationId: deleteNote
      tags: [notes]
      summary: Delete a quick note
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Note deleted
  /deadlines:
    get:
      operationId: listDeadlines
      tags: [deadlines]
      summary: List upcoming deadlines
      responses:
        "200":
          description: Deadline list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Deadline"
    post:
      operationId: createDeadline
      tags: [deadlines]
      summary: Create a deadline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeadlineInput"
      responses:
        "201":
          description: Created deadline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deadline"
  /deadlines/{id}:
    patch:
      operationId: updateDeadline
      tags: [deadlines]
      summary: Update a deadline
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeadlineUpdate"
      responses:
        "200":
          description: Updated deadline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deadline"
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Project:
      type: object
      required: [id, name, path, status, stack, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        path: { type: string }
        status:
          type: string
          enum: [active, client, experiment, archived]
        stack:
          type: array
          items: { type: string }
        updatedAt: { type: string }
        progress: { type: number, minimum: 0, maximum: 100 }
    ProjectInput:
      type: object
      required: [name, path, status]
      properties:
        name: { type: string, minLength: 1 }
        path: { type: string, minLength: 1 }
        status:
          type: string
          enum: [active, client, experiment, archived]
        stack:
          type: array
          items: { type: string }
    Note:
      type: object
      required: [id, title, content, tag, pinned, updatedAt]
      properties:
        id: { type: string }
        title: { type: string }
        content: { type: string }
        tag: { type: string }
        pinned: { type: boolean }
        updatedAt: { type: string }
    NoteInput:
      type: object
      required: [title, content]
      properties:
        title: { type: string, minLength: 1 }
        content: { type: string }
        tag: { type: string }
        pinned: { type: boolean }
    NoteUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        content: { type: string }
        tag: { type: string }
        pinned: { type: boolean }
    Deadline:
      type: object
      required: [id, title, category, targetAt, completed]
      properties:
        id: { type: string }
        title: { type: string }
        category:
          type: string
          enum: [exam, submission, server, personal]
        targetAt: { type: string }
        completed: { type: boolean }
    DeadlineInput:
      type: object
      required: [title, category, targetAt]
      properties:
        title: { type: string, minLength: 1 }
        category:
          type: string
          enum: [exam, submission, server, personal]
        targetAt: { type: string }
    DeadlineUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        category:
          type: string
          enum: [exam, submission, server, personal]
        targetAt: { type: string }
        completed: { type: boolean }
    Activity:
      type: object
      required: [id, title, detail, time, type]
      properties:
        id: { type: string }
        title: { type: string }
        detail: { type: string }
        time: { type: string }
        type:
          type: string
          enum: [project, study, game, system]
    StudySnapshot:
      type: object
      required: [course, progress, nextLabel, nextAt]
      properties:
        course: { type: string }
        progress: { type: number, minimum: 0, maximum: 100 }
        nextLabel: { type: string }
        nextAt: { type: string }
    IntegrationStatus:
      type: object
      required: [id, name, category, status, detail]
      properties:
        id: { type: string }
        name: { type: string }
        category: { type: string }
        status:
          type: string
          enum: [connected, ready, planned]
        detail: { type: string }
    CortexStats:
      type: object
      required: [activeProjects, openDeadlines, focusMinutes, studyProgress]
      properties:
        activeProjects: { type: number }
        openDeadlines: { type: number }
        focusMinutes: { type: number }
        studyProgress: { type: number }
    CortexOverview:
      type: object
      required: [greeting, stats, projects, deadlines, activities, study, integrations]
      properties:
        greeting: { type: string }
        stats:
          $ref: "#/components/schemas/CortexStats"
        projects:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        deadlines:
          type: array
          items:
            $ref: "#/components/schemas/Deadline"
        activities:
          type: array
          items:
            $ref: "#/components/schemas/Activity"
        study:
          $ref: "#/components/schemas/StudySnapshot"
        integrations:
          type: array
          items:
            $ref: "#/components/schemas/IntegrationStatus"

